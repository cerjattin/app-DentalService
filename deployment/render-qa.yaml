{
  "services": [
    {
      "type": "web",
      "name": "odontho-clinical-api-qa",
      "runtime": "node",
      "plan": "free",
      "region": "virginia",
      "rootDir": "backend",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --include=dev && npm run prisma:generate && npm run build",
      "startCommand": "npm start",
      "healthCheckPath": "/health/ready",
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "24.22.1"
        },
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "HOST",
          "value": "0.0.0.0"
        },
        {
          "key": "APP_TIMEZONE",
          "value": "America/Curacao"
        },
        {
          "key": "SVB_MANUAL_RECORDING_ENABLED",
          "value": "false"
        },
        {
          "key": "DB_CONNECTION_LIMIT",
          "value": "3"
        },
        {
          "key": "LOG_LEVEL",
          "value": "info"
        },
        {
          "key": "OPENAPI_ENABLED",
          "value": "false"
        },
        {
          "key": "DOCUMENT_STORAGE_PROVIDER",
          "value": "SUPABASE"
        },
        {
          "key": "DOCUMENT_MAX_UPLOAD_BYTES",
          "value": "4194304"
        },
        {
          "key": "DATABASE_CA_CERT_PATH",
          "value": "/etc/secrets/supabase-ca.crt"
        },
        {
          "key": "DATABASE_URL",
          "sync": false
        },
        {
          "key": "SUPABASE_URL",
          "sync": false
        },
        {
          "key": "SUPABASE_SERVICE_ROLE_KEY",
          "sync": false
        },
        {
          "key": "SUPABASE_STORAGE_BUCKET",
          "value": "qa-clinical-documents"
        },
        {
          "key": "CORS_ALLOWED_ORIGINS",
          "sync": false
        },
        {
          "key": "ACCESS_TOKEN_SECRET",
          "generateValue": true
        }
      ]
    },
    {
      "type": "web",
      "name": "odontho-clinical-web-qa",
      "runtime": "static",
      "rootDir": "frontend",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --include=dev && npm run build",
      "staticPublishPath": "dist",
      "routes": [
        {
          "type": "rewrite",
          "source": "/*",
          "destination": "/index.html"
        }
      ],
      "headers": [
        {
          "path": "/*",
          "name": "X-Content-Type-Options",
          "value": "nosniff"
        },
        {
          "path": "/*",
          "name": "X-Frame-Options",
          "value": "DENY"
        },
        {
          "path": "/*",
          "name": "Referrer-Policy",
          "value": "no-referrer"
        },
        {
          "path": "/*",
          "name": "Cache-Control",
          "value": "no-cache"
        }
      ],
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "24.22.1"
        },
        {
          "key": "VITE_API_BASE_URL",
          "sync": false
        },
        {
          "key": "VITE_APP_ENVIRONMENT",
          "value": "qa"
        },
        {
          "key": "VITE_APP_VERSION",
          "sync": false
        }
      ]
    }
  ]
}
