name: Operational gap corrections
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/operational-gaps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  services-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-master03-only
          POSTGRES_DB: odontho_operational_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: postgresql://postgres:isolated-master03-only@127.0.0.1:5432/odontho_operational_test
      TEST_DATABASE_URL: postgresql://postgres:isolated-master03-only@127.0.0.1:5432/odontho_operational_test
      ACCESS_TOKEN_SECRET: isolated-master03-ci-secret-at-least-32-characters
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install existing dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Prepare existing Backend and isolated PostgreSQL
        working-directory: backend
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
          npx prisma db seed
          npm run build
      - name: Backend full integration suite
        working-directory: backend
        run: npm test -- --reporter=default --reporter=json --outputFile=operational-test-results.json
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Frontend complete test suite
        working-directory: frontend
        run: npm test -- --reporter=default --reporter=json --outputFile=qa/unit-results.json
      - name: Prepare external browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/operational-browser" playwright
          "$RUNNER_TEMP/operational-browser/node_modules/.bin/playwright" install chromium --with-deps
      - name: Live browser QA and responsive verification
        run: MASTER03_PLAYWRIGHT_MODULE="$RUNNER_TEMP/operational-browser/node_modules/playwright/index.mjs" node frontend/scripts/operational-gaps-browser-qa.mjs
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-validation
          path: |
            frontend/qa
            backend/operational-test-results.json
          if-no-files-found: warn
